<div class="cart-container">

  <h1 class="title">Your Cart</h1>

  <div *ngIf="items.length === 0" class="empty">
    Your cart is empty.
  </div>

  <div class="cart-items" *ngIf="items.length > 0">

    <div class="cart-item" *ngFor="let item of items">

      <!-- IMAGE -->
      <img class="thumb" [src]="item.product.imageUrl" />

      <!-- DETAILS SECTION -->
      <div class="details">
        <h3>{{ item.product.name }}</h3>

        <div class="meta">
          <span class="chip">{{ item.product.category }}</span>
          <span class="rating">⭐ {{ item.product.rating }}</span>
        </div>

        <p class="desc">
          {{ item.product.description }}
        </p>

        <div class="price-row">
          <span class="price">€{{ item.product.price | number:'1.2-2' }}</span>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="actions">

        <input type="number"
               min="1"
               [value]="item.quantity"
               (change)="updateQuantity(item.product.id, $event.target.valueAsNumber)" />

        <button class="remove" (click)="remove(item.product.id)">
          Remove ✖
        </button>

      </div>

    </div>

  </div>

  <!-- FIXED BOTTOM BAR -->
  <div class="checkout-bar" *ngIf="items.length > 0">
    <div class="total">Total: €{{ total | number:'1.2-2' }}</div>

    <button class="btn-primary" routerLink="/checkout">
      Proceed to Checkout
    </button>
  </div>

</div>
