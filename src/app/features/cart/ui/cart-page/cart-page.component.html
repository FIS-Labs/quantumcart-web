<div class="cart-container">
  <div *ngIf="items.length === 0" class="empty">
    {{ translationService.t('emptyCart') }}
  </div>

  <div class="cart-items" *ngIf="items.length > 0">
    <div class="cart-item" *ngFor="let item of items">
      <img class="thumb" [src]="item.imageUrl" />

      <div class="details">
        <h3>{{ item.name }}</h3>

        <div class="meta">
          <span class="chip">
            {{ translationService.currentLang === 'en' ? item.category : item.categoryDe }}
          </span>
        </div>

        <div class="price-row">
          <span class="price">€{{ item.price | number: '1.2-2' }}</span>
        </div>
      </div>

      <div class="actions">
        <input
          type="number"
          min="1"
          [value]="item.quantity"
          (change)="updateQuantity(item.productId, $event.target.valueAsNumber)"
        />

        <button class="remove" (click)="remove(item.productId)">
          {{ translationService.t('remove') }} ✖
        </button>
      </div>
    </div>
  </div>

  <div class="checkout-bar" *ngIf="items.length > 0">
    <div class="total">{{ translationService.t('total') }}: €{{ total | number: '1.2-2' }}</div>

    <button class="btn-primary" routerLink="/cart/checkout">
      {{ translationService.t('proceedToCheckout') }}
    </button>
  </div>
</div>
