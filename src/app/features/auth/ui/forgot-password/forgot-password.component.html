<div class="forgot-password-container">
  <div class="forgot-password-card glass">
    <div class="language-selector">
      <select
        [ngModel]="translationService.currentLang"
        (ngModelChange)="translationService.switchLang($event)"
      >
        <option value="en">🇬🇧 EN</option>
        <option value="de">🇩🇪 DE</option>
      </select>
    </div>

    <h1 class="title">{{ translationService.t('resetPassword') }}</h1>

    <p class="instruction" *ngIf="!success">
      {{ translationService.t('enterEmailToReset') }}
    </p>

    <!-- Success Message -->
    <div class="success-message" *ngIf="success">
      <div class="success-icon">✓</div>
      <p>{{ translationService.t('resetLinkSent') }}</p>
      <button class="btn-primary" routerLink="/auth/login">
        {{ translationService.t('backToLogin') }}
      </button>
    </div>

    <!-- Reset Form -->
    <form *ngIf="!success" (ngSubmit)="resetPassword()">
      <div class="form-group">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="translationService.t('email')"
          [class.invalid]="submitted && !email"
          required
        />
        <small class="error" *ngIf="submitted && !email">
          {{ translationService.t('requiredField') }}
        </small>
        <small class="error" *ngIf="errorMessage">
          {{ errorMessage }}
        </small>
      </div>

      <button type="submit" class="btn-primary">
        {{ translationService.t('resetPassword') }}
      </button>

      <a routerLink="/auth/login" class="back-link">
        {{ translationService.t('backToLogin') }}
      </a>
    </form>
  </div>
</div>
