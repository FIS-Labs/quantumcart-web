<div class="lang-wrapper">
  <select
    class="lang-switch"
    [ngModel]="translationService.currentLang"
    (ngModelChange)="translationService.switchLang($event)"
  >
    <option value="en">🇬🇧 EN</option>
    <option value="de">🇩🇪 DE</option>
  </select>
</div>

<div class="auth-container">
  <div class="auth-card glass">
    <img src="assets/logo.png" alt="QuantumCart Logo" class="logo" />

    <h2 class="page-title">{{ translationService.t('welcomeBack') }}</h2>

    <p class="subtitle">{{ translationService.t('signInToContinue') }}</p>

    <form (ngSubmit)="onSubmit()" class="form-grid">
      <div class="input-group">
        <label>{{ translationService.t('email') }}</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="translationService.t('email')"
          required
        />
      </div>

      <div class="input-group">
        <label>{{ translationService.t('password') }}</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          [placeholder]="translationService.t('password')"
          required
        />
        <a routerLink="/auth/forgot-password" class="forgot-password-link">
          {{ translationService.t('forgotPassword') }}
        </a>
      </div>

      <button class="btn-primary">{{ translationService.t('signIn') }}</button>
    </form>

    <div class="auth-footer">
      <p>
        {{ translationService.t('noAccount') }}
        <a routerLink="/auth/register">{{ translationService.t('signUp') }}</a>
      </p>
    </div>
  </div>
</div>
