<div class="lang-wrapper">
  <select
    class="lang-switch"
    [ngModel]="translationService.currentLang"
    (ngModelChange)="translationService.switchLang($event)"
  >
    <option value="en">🇬🇧 EN</option>
    <option value="de">🇩🇪 DE</option>
  </select>
</div>

<div class="auth-container">
  <div class="auth-card glass">
    <img src="assets/logo.png" class="logo" alt="QuantumCart Logo" />

    <h2 class="page-title">{{ translationService.t('createAccount') }}</h2>

    <p class="subtitle">{{ translationService.t('joinMarketplace') }}</p>

    <form (ngSubmit)="onSubmit()" class="form-grid">
      <div class="input-group">
        <label>{{ translationService.t('fullName') }}</label>
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          [placeholder]="translationService.t('fullName')"
          required
        />
      </div>

      <div class="input-group">
        <label>{{ translationService.t('email') }}</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="translationService.t('email')"
          required
        />
      </div>

      <div class="input-group">
        <label>{{ translationService.t('password') }}</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          [placeholder]="translationService.t('password')"
          required
        />
      </div>

      <div class="input-group">
        <label>{{ translationService.t('confirmPassword') }}</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          [placeholder]="translationService.t('confirmPassword')"
          required
        />
      </div>

      <button class="btn-primary">{{ translationService.t('signUp') }}</button>
    </form>

    <div class="auth-footer">
      <p>
        {{ translationService.t('alreadyHaveAccount') }}
        <a routerLink="/auth/login">{{ translationService.t('signIn') }}</a>
      </p>
    </div>
  </div>
</div>
