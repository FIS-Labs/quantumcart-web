<div class="auth-header">
  <a routerLink="/products" class="btn-guest-header">
    👤 {{ translationService.t('continueAsGuest') }}
  </a>
  <div class="lang-wrapper">
    <select class="lang-switch" [ngModel]="translationService.currentLang"
      (ngModelChange)="translationService.switchLang($event)">
      <option value="en">🇬🇧 EN</option>
      <option value="de">🇩🇪 DE</option>
    </select>
  </div>
</div>

<div class="auth-container">
  <div class="auth-card glass">
    <img src="assets/logo.png" class="logo" alt="QuantumCart Logo" />

    <h2 class="page-title">{{ translationService.t('createAccount') }}</h2>

    <p class="subtitle">{{ translationService.t('joinMarketplace') }}</p>

    <form (ngSubmit)="onSubmit()" class="form-grid">
      <div class="input-group">
        <label for="reg-name">{{ translationService.t('fullName') }}</label>
        <input type="text" id="reg-name" [(ngModel)]="name" name="name" [placeholder]="translationService.t('fullName')"
          required />
      </div>

      <div class="input-group">
        <label for="reg-email">{{ translationService.t('email') }}</label>
        <input type="email" id="reg-email" [(ngModel)]="email" name="email"
          [placeholder]="translationService.t('email')" required />
      </div>

      <div class="input-group">
        <label for="reg-password">{{ translationService.t('password') }}</label>
        <input type="password" id="reg-password" [(ngModel)]="password" name="password"
          [placeholder]="translationService.t('password')" required />
      </div>

      <div class="input-group">
        <label for="reg-confirm">{{ translationService.t('confirmPassword') }}</label>
        <input type="password" id="reg-confirm" [(ngModel)]="confirmPassword" name="confirmPassword"
          [placeholder]="translationService.t('confirmPassword')" required />
      </div>

      <button class="btn-primary">{{ translationService.t('signUp') }}</button>
    </form>

    <div class="auth-footer">
      <p>
        {{ translationService.t('alreadyHaveAccount') }}
        <a routerLink="/auth/login">{{ translationService.t('signIn') }}</a>
      </p>
    </div>
  </div>
</div>
