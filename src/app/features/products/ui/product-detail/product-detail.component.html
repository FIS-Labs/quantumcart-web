<div class="detail-wrapper">

  <div class="detail-card">

    <!-- IMAGE -->
    <div class="image-wrapper">
      <img [src]="product.imageUrl" alt="{{ product.name }}" />

      <span class="rating-badge">⭐ {{ product.rating }}</span>

      <span class="discount" *ngIf="product.oldPrice">
        -{{ ((1 - product.price / product.oldPrice) * 100) | number:'1.0-0' }}%
      </span>
    </div>

    <!-- TITLE -->
    <h1 class="title">{{ product.name }}</h1>

    <!-- PRICE -->
    <div class="price-area">
      <span class="current">€{{ product.price | number:'1.2-2' }}</span>
      <span class="old" *ngIf="product.oldPrice">€{{ product.oldPrice }}</span>
    </div>

    <!-- CATEGORY -->
    <span class="category-chip">{{ product.category }}</span>

    <!-- DESCRIPTION -->
    <p class="description">{{ product.description }}</p>

    <!-- BUTTONS -->
    <div class="button-row">
      <button mat-raised-button class="btn-primary" (click)="addToCart()">
        Add to Cart
      </button>

      <button mat-raised-button class="btn-secondary" routerLink="/cart">
        Go to Cart
      </button>
    </div>

  </div>

</div>
